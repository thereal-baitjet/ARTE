name: Database Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "tests/integration/*.mjs"
      - "app/api/corridor/**"
      - "lib/corridor/**"
      - "lib/auth/**"
      - "lib/account/**"
      - "lib/analytics/**"
      - "components/**"
      - "scripts/generate-database-catalog-test.mjs"
      - "scripts/build-met-catalog.mjs"
      - "scripts/build-catalog-manifest.mjs"
      - "scripts/*cleveland*"
      - "scripts/*nga*"
      - "scripts/*moma*"
      - "lib/artworks/data/catalog-manifest.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tests/integration/*.mjs"
      - "app/api/corridor/**"
      - "lib/corridor/**"
      - "lib/auth/**"
      - "lib/account/**"
      - "lib/analytics/**"
      - "components/**"
      - "scripts/generate-database-catalog-test.mjs"
      - "scripts/build-met-catalog.mjs"
      - "scripts/build-catalog-manifest.mjs"
      - "scripts/*cleveland*"
      - "scripts/*nga*"
      - "scripts/*moma*"
      - "lib/artworks/data/catalog-manifest.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check catalog SQL expectations match release manifest
        run: |
          node scripts/build-catalog-manifest.mjs --check
          node scripts/generate-database-catalog-test.mjs --check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations and seed
        run: supabase db reset --local
      - name: Run database tests
        run: supabase test db
      - name: Run local Auth integration
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node tests/integration/auth-local.mjs
      - name: Verify corridor HTTP API with real local Auth
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          npm run build
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node tests/integration/corridor-api-local.mjs
      - name: Install browser for authenticated gauntlet
        run: npx playwright install --with-deps chromium
      - name: Verify signed-in browser journeys with real local Auth
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          node tests/integration/account-browser-local.mjs
      - name: Upload authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-gauntlet
          path: test-results/account-browser/
          retention-days: 7
      - name: Re-apply migrations and seed to prove repeatability
        run: supabase db reset --local
      - name: Re-run database tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
